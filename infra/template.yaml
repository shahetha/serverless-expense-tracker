AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Smart Expense Tracker — serverless backend

Globals:
  Function:
    Runtime: nodejs18.x
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        TABLE_NAME: !Ref ExpensesTable
        RECEIPTS_BUCKET: !Ref ReceiptsBucket

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Resources:

  # ── Cognito ──────────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "expense-tracker-${Stage}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "expense-tracker-client-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # ── DynamoDB ─────────────────────────────────────────────────────────────────
  ExpensesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "expenses-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ── S3 receipts bucket ───────────────────────────────────────────────────────
  ReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "expense-receipts-${Stage}-${AWS::AccountId}"
      AccessControl: Private
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  # ── API Gateway ───────────────────────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["*"]
        AllowMethods: ["*"]

  # ── Lambda: Expenses CRUD ────────────────────────────────────────────────────
  ExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: expenses.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExpensesTable
      Events:
        GetExpenses:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/expenses
            Method: GET
        CreateExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/expenses
            Method: POST
        UpdateExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/expenses/{id}
            Method: PUT
        DeleteExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/expenses/{id}
            Method: DELETE

  # ── Lambda: Monthly Summary ───────────────────────────────────────────────────
  SummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: summary.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
      Events:
        GetSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/summary/monthly
            Method: GET

  # ── Lambda: Receipts presign ─────────────────────────────────────────────────
  ReceiptsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: receipts.handler
      Environment:
        Variables:
          RECEIPTS_BUCKET: !Ref ReceiptsBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ReceiptsBucket
      Events:
        Presign:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/receipts/presign
            Method: POST

# ── Outputs ───────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
  ReceiptsBucket:
    Description: S3 bucket for receipts
    Value: !Ref ReceiptsBucket
